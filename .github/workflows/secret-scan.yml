# Secret scan: gitleaks over the commits of every pull request and every push to main.
# Runs with the job's own GITHUB_TOKEN only (read-only on contents and pull requests; the PR read
# lets the action list the PR's commits so it scans exactly those). No license is needed for a
# personal account and PR comments are off because the token has no write permission.
# A hit fails the job: rotate the secret first, then rewrite the branch so the value is gone.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the scan walks the commits of the PR or push, not just the checked-out tree

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
